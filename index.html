<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TvBox — Live Ip TV App</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
/* ===== ROOT VARIABLES ===== */
:root {
  --bg: #080808;
  --surface: #0f0f0f;
  --card: #161616;
  --card-hover: #1e1e1e;
  --accent: #e50914;
  --accent-dim: rgba(229,9,20,0.12);
  --accent-glow: rgba(229,9,20,0.35);
  --text: #ffffff;
  --text-muted: #888888;
  --text-dim: #444444;
  --border: rgba(255,255,255,0.07);
  --border-bright: rgba(255,255,255,0.13);
  --glass: rgba(8,8,8,0.88);
  --input-bg: rgba(255,255,255,0.055);
  --shadow-xl: 0 30px 60px rgba(0,0,0,0.85);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.55);
  --topbar-h: 58px;
  --foot-h: 38px;
  --sidebar-w: 350px;
  --r-xl: 18px;
  --r-lg: 12px;
  --r-md: 9px;
  --r-sm: 6px;
}
[data-theme="light"] {
  --bg: #efefef;
  --surface: #ffffff;
  --card: #f5f5f5;
  --card-hover: #e8e8e8;
  --text: #0d0d0d;
  --text-muted: #666666;
  --text-dim: #aaaaaa;
  --border: rgba(0,0,0,0.07);
  --border-bright: rgba(0,0,0,0.13);
  --glass: rgba(255,255,255,0.92);
  --input-bg: rgba(0,0,0,0.04);
  --shadow-xl: 0 30px 60px rgba(0,0,0,0.12);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s,color .3s;}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.5;
}
[data-theme="light"] body::before{opacity:0.15;}

.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}

.topbar{
  height:var(--topbar-h);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:var(--glass);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);z-index:200;
}
.topbar-left{display:flex;align-items:center;gap:20px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;user-select:none;}
.brand-icon{
  width:34px;height:34px;flex-shrink:0;background:var(--accent);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px var(--accent-glow);transition:box-shadow .3s;
}
.brand:hover .brand-icon{box-shadow:0 0 30px var(--accent);}
.brand-text{display:flex;flex-direction:column;line-height:1;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:1.75rem;letter-spacing:3px;color:var(--text);}
.brand-tag{font-size:0.5rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-top:1px;}

.topbar-right{display:flex;align-items:center;gap:6px;}
.tb-divider{width:1px;height:22px;background:var(--border-bright);margin:0 2px;}

.icon-btn{
  width:36px;height:36px;border-radius:var(--r-md);
  background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;position:relative;flex-shrink:0;
}
.icon-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.icon-btn svg{width:17px;height:17px;pointer-events:none;}

.icon-btn[data-tip]::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border-bright);
  color:var(--text);font-size:0.68rem;font-weight:500;padding:4px 10px;border-radius:var(--r-sm);
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999;
}
.icon-btn[data-tip]:hover::after{opacity:1;}

.theme-btn{
  display:flex;align-items:center;gap:7px;padding:0 13px;height:36px;border-radius:var(--r-md);
  background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-muted);font-size:0.78rem;font-weight:600;
  font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.theme-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.theme-btn svg{width:15px;height:15px;flex-shrink:0;}

.cpw{position:relative;}
.cp-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;
  background:var(--surface);border:1px solid var(--border-bright);
  border-radius:var(--r-xl);padding:16px;display:none;flex-direction:column;gap:10px;
  z-index:9999;box-shadow:var(--shadow-xl);min-width:210px;
}
.cp-dropdown.open{display:flex;}
.cp-label{font-size:0.68rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
.cp-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.swatch{
  width:38px;height:38px;border-radius:10px;cursor:pointer;
  border:2px solid transparent;transition:all .2s;position:relative;
}
.swatch:hover,.swatch.active{transform:scale(1.12);border-color:rgba(255,255,255,0.7);}
.swatch[data-name]::before{
  content:attr(data-name);position:absolute;bottom:calc(100%+5px);left:50%;transform:translateX(-50%);
  font-size:0.6rem;white-space:nowrap;background:var(--card);color:var(--text);padding:3px 8px;border-radius:4px;
  opacity:0;transition:opacity .15s;pointer-events:none;border:1px solid var(--border-bright);
}
.swatch:hover[data-name]::before{opacity:1;}

.main-row{display:flex;flex:1;min-height:0;overflow:hidden;}

.player-section{flex:1;min-width:0;display:flex;flex-direction:column;background:#000;overflow:hidden;}
.video-wrap{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at center,#111 0%,#000 100%);overflow:hidden;}
#vp{width:100%;height:100%;object-fit:contain;display:block;background:#000;}

.loader-ov{
  position:absolute;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;
}
.ld-ring{width:46px;height:46px;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-txt{font-size:0.82rem;color:var(--text-muted);font-weight:500;}

.pbar{
  height:54px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px;
}
.now-playing{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 8px var(--accent);animation:livePulse 2s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(.8);}}
.live-badge{font-size:0.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;background:var(--accent);color:#fff;padding:3px 8px;border-radius:4px;flex-shrink:0;}
.ch-now-title{font-size:0.95rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.qw{position:relative;}
.q-btn{
  display:flex;align-items:center;gap:6px;padding:0 12px;height:32px;border-radius:var(--r-md);
  background:var(--input-bg);border:1px solid var(--border);color:var(--text);font-size:0.76rem;font-weight:600;
  font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.q-btn:hover{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.q-btn svg{width:13px;height:13px;color:var(--accent);}
.q-btn .qchev{width:11px;height:11px;color:var(--text-muted);transition:transform .2s;}
.q-btn.open .qchev{transform:rotate(180deg);}
.q-dropdown{
  position:absolute;bottom:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border-bright);
  border-radius:var(--r-lg);overflow:hidden;display:none;min-width:175px;box-shadow:var(--shadow-md);z-index:200;
}
.q-dropdown.open{display:block;}
.q-opt{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:0.78rem;cursor:pointer;color:var(--text-muted);transition:all .15s;}
.q-opt svg{width:13px;height:13px;flex-shrink:0;}
.q-opt:hover{background:var(--accent-dim);color:var(--accent);}
.q-opt.active{color:var(--accent);font-weight:700;}
.q-opt.active::after{content:'✓';margin-left:auto;font-size:0.7rem;}

.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-top{flex-shrink:0;padding:14px 14px 0;border-bottom:1px solid var(--border);background:var(--surface);}
.search-wrap{position:relative;}
.search-wrap .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);pointer-events:none;}
#ch-search{
  width:100%;height:36px;padding:0 12px 0 36px;border-radius:50px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);font-size:0.8rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:all .2s;
}
#ch-search::placeholder{color:var(--text-dim);}
#ch-search:focus{border-color:var(--accent);background:var(--accent-dim);}

.cat-tabs{display:flex;gap:5px;padding:10px 0 12px;overflow-x:auto;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{
  display:inline-flex;align-items:center;gap:5px;padding:4px 13px;border-radius:50px;
  font-size:0.72rem;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--input-bg);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.cat-tab:hover{border-color:var(--accent);color:var(--accent);}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.cat-count{font-size:0.6rem;background:rgba(255,255,255,0.18);padding:1px 5px;border-radius:8px;font-weight:700;}
.cat-tab.active .cat-count{background:rgba(255,255,255,0.22);}

.ch-info-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px;flex-shrink:0;}
.ch-info-label{font-size:0.68rem;color:var(--text-dim);font-weight:500;}
.ch-info-count{font-size:0.68rem;color:var(--accent);font-weight:700;}

.ch-grid{
  flex:1;overflow-y:auto;padding:6px 10px 12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(97px,1fr));gap:8px;align-content:start;
}
.ch-grid::-webkit-scrollbar{width:3px;}
.ch-grid::-webkit-scrollbar-track{background:transparent;}
.ch-grid::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

/* ===== CHANNEL CARD + LOGO FIX ===== */
.ch-card{
  background:var(--card);border-radius:var(--r-lg);cursor:pointer;padding:10px 6px 8px;text-align:center;
  border:2px solid transparent;transition:all .22s;position:relative;overflow:hidden;
}
.ch-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.65) 100%);
  opacity:0;transition:opacity .22s;z-index:1;pointer-events:none;
}
.ch-card:hover::after{opacity:1;}
.ch-card:hover{background:var(--card-hover);transform:translateY(-3px) scale(1.025);box-shadow:0 10px 24px rgba(0,0,0,0.45);}
.ch-card.active{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 4px 18px var(--accent-glow);}

.live-pip{
  display:none;position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 6px var(--accent);animation:livePulse 2s ease-in-out infinite;z-index:3;
}
.ch-card.active .live-pip{display:block;}

.ch-play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:2;opacity:0;transition:opacity .22s;
}
.ch-play svg{width:30px;height:30px;}
.ch-card:hover .ch-play{opacity:1;}

/* Improved logo container – always has visible background */
.ch-logo-wrap{
  width:52px;height:52px;border-radius:11px;
  background:#1a1a1a;          /* solid dark so white logos stay visible */
  margin:0 auto 7px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);transition:border-color .2s;
  position:relative;
}
.ch-card.active .ch-logo-wrap{border-color:var(--accent);}
.ch-logo{
  width:100%;height:100%;
  object-fit:contain;
  padding:5px;
  display:block;
  background:transparent;
}
/* Placeholder letter when image fails */
.ch-logo-fallback{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#e50914,#b20710);
  border-radius:11px;
  letter-spacing:0.5px;
}

.ch-name{
  font-size:0.58rem;font-weight:600;color:var(--text-muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  line-height:1.35;transition:color .2s;
}
.ch-card.active .ch-name{color:var(--accent);}

.empty-state{
  grid-column:1/-1;padding:48px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty-state svg{width:44px;height:44px;opacity:.3;color:var(--text-muted);}
.empty-state p{font-size:0.82rem;color:var(--text-muted);}

.footer{
  height:var(--foot-h);flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;padding:0 18px;gap:10px;
}
.footer-credit{font-size:0.6rem;color:var(--text-dim);white-space:nowrap;}
.footer-credit b{color:var(--accent);}

#global-loader{
  position:fixed;inset:0;background:#060606;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s;
}
.gl-icon{
  width:68px;height:68px;background:var(--accent);border-radius:20px;
  display:flex;align-items:center;justify-content:center;animation:glPulse 1.8s ease-in-out infinite;
}
@keyframes glPulse{0%,100%{box-shadow:0 0 40px var(--accent-glow);}50%{box-shadow:0 0 80px var(--accent),0 0 120px var(--accent-glow);}}
.gl-name{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;letter-spacing:5px;color:#fff;}
.gl-sub{font-size:0.78rem;color:#555;letter-spacing:1px;margin-top:-18px;}
.gl-bar{width:180px;height:2px;background:rgba(255,255,255,0.07);border-radius:10px;overflow:hidden;}
.gl-fill{height:100%;background:var(--accent);border-radius:10px;animation:glBar 2s ease-in-out infinite;}
@keyframes glBar{0%{width:0%;}60%{width:75%;}100%{width:100%;}}

.toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:7px;z-index:10000;}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:var(--r-lg);
  background:var(--card);border:1px solid var(--border-bright);color:var(--text);font-size:0.8rem;font-weight:500;
  box-shadow:var(--shadow-md);animation:tIn .28s ease;min-width:230px;max-width:310px;
}
.toast svg{width:17px;height:17px;flex-shrink:0;}
.toast.success{border-left:3px solid #22c55e;}
.toast.success svg{color:#22c55e;}
.toast.error{border-left:3px solid #ef4444;}
.toast.error svg{color:#ef4444;}
.toast.info{border-left:3px solid var(--accent);}
.toast.info svg{color:var(--accent);}
@keyframes tIn{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes tOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(110%);opacity:0;}}

@media(max-width:1100px){:root{--sidebar-w:310px;}}
@media(max-width:992px){
  html,body{overflow:auto;height:auto;}
  .app{height:auto;min-height:100vh;overflow:visible;}
  .main-row{flex-direction:column;height:auto;overflow:visible;}
  .player-section{flex:none;}
  .video-wrap{height:44vw;min-height:260px;flex:none;}
  .sidebar{width:100%;flex:none;border-left:none;border-top:1px solid var(--border);max-height:60vh;}
}
@media(max-width:768px){
  :root{--topbar-h:50px;}
  .topbar{padding:0 12px;}
  .brand-name{font-size:1.5rem;}
  .theme-btn span{display:none;}
  .theme-btn{padding:0 10px;width:36px;}
  .icon-btn[data-tip]::after{display:none;}
  .video-wrap{height:30vh;min-height:200px;}
  .pbar{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px;}
  .ch-now-title{font-size:0.82rem;}
  .ch-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:6px 8px 12px;}
  .ch-logo-wrap{width:44px;height:44px;}
  .ch-card{padding:8px 4px 6px;}
  .ch-name{font-size:0.52rem;}
  .sidebar{max-height:none;}
}
@media(max-width:480px){
  .ch-grid{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));}
  .ch-logo-wrap{width:40px;height:40px;}
}

::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}
</style>
</head>
<body data-theme="dark">

<div id="global-loader">
  <div class="gl-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2.5"/>
      <path d="M8 21h8"/><path d="M12 17v4"/>
    </svg>
  </div>
  <div class="gl-name">TvBox</div>
  <div class="gl-sub">Live IpTv Streaming</div>
  <div class="gl-bar"><div class="gl-fill"></div></div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-left">
      <a href="#" class="brand">
        <div class="brand-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2.5"/>
            <path d="M8 21h8"/><path d="M12 17v4"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">TvBox</span>
          <span class="brand-tag"></span>
        </div>
      </a>
    </div>
    <div class="topbar-right">
      <div class="cpw" id="cpw">
        <button class="icon-btn" id="cpBtn" data-tip="থিম কালার">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <div class="cp-dropdown" id="cpDrop">
          <div class="cp-label">থিম কালার</div>
          <div class="cp-swatches" id="cpSwatches"></div>
        </div>
      </div>
      <button class="icon-btn" id="ssBtn" data-tip="স্ক্রিনশট">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button class="icon-btn" id="shareBtn" data-tip="শেয়ার">

// ===== HLS =====
function destroyHls(){
  if(hls){try{hls.destroy();}catch(e){}hls=null;}
  if(retryTimeout) clearTimeout(retryTimeout);
}
function showLoader(txt='স্ট্রিম লোড হচ্ছে...'){ldTxt.textContent=txt;ldOv.style.display='flex';}
function hideLoader(){ldOv.style.display='none';}

function scheduleRetry(url){
  if(currentLoadRetries>=MAX_RETRIES){
    if(!globalErrorShown){globalErrorShown=true;showToast('একাধিক চেষ্টা ব্যর্থ! অন্য চ্যানেল নির্বাচন করুন।','error');}
    hideLoader(); return;
  }
  currentLoadRetries++;
  const delay=currentLoadRetries*1500;
  showLoader(`পুনরায় চেষ্টা (${currentLoadRetries}/${MAX_RETRIES})...`);
  retryTimeout=setTimeout(()=>doLoad(url),delay);
}

function doLoad(url){
  vp.pause(); destroyHls();
  showLoader(`স্ট্রিম খোলা হচ্ছে...`);
  if(!Hls.isSupported()){hideLoader();showToast('আপনার ব্রাউজার HLS সমর্থন করে না।','error');return;}
  hls=new Hls({enableWorker:true,lowLatencyMode:true});
  hls.loadSource(url); hls.attachMedia(vp);
  let fatalHandled=false;
  const onManifest=()=>{
    globalErrorShown=false; currentLoadRetries=0; hideLoader();
    vp.play().catch(()=>{});
    if(hls&&hls.levels&&hls.levels.length){buildQualityOpts(hls.levels);if(hls.currentLevel!==-1)hls.currentLevel=-1;}
    else buildQualityOpts([]);
    cleanup();
  };
  const onErr=(e,d)=>{
    if(d.fatal){
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){cleanup();scheduleRetry(url);}
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){if(hls)hls.recoverMediaError();}
      else{cleanup();scheduleRetry(url);}
    } else if(d.details==='manifestLoadError'&&!fatalHandled){
      fatalHandled=true;cleanup();scheduleRetry(url);
    }
  };
  const cleanup=()=>{if(hls){hls.off(Hls.Events.MANIFEST_PARSED,onManifest);hls.off(Hls.Events.ERROR,onErr);}};
  hls.on(Hls.Events.MANIFEST_PARSED,onManifest);
  hls.on(Hls.Events.ERROR,onErr);
}
function loadStream(url){
  if(retryTimeout) clearTimeout(retryTimeout);
  currentLoadRetries=0; globalErrorShown=false;
  buildQualityOpts([]); doLoad(url);
}

// ===== PLAYLIST LOADING + LOGO FIX =====
async function loadConfig(){
  try{
    const r=await fetch(getConfigUrl());
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json(); FIXED_PLAYLISTS=d.sources||[];
  } catch(e){console.error('Config load failed:',e);FIXED_PLAYLISTS=[];}
}

async function fetchM3u(key){
  try{
    const r=await fetch(`${PROXY_URL}?source=${key}`);
    if(!r.ok) return '';
    return await r.text();
  } catch(e){return '';}
}

/** Clean & normalize logo URL */
function cleanLogo(url){
  if(!url || typeof url !== 'string') return '';
  let u = url.trim()
    .replace(/^["']+|["']+$/g, '')          // strip quotes
    .replace(/[“”‘’]/g, '')                 // strip curly quotes
    .replace(/\s+/g, '');
  if(!u) return '';
  // Force HTTPS (GitHub Pages is HTTPS → mixed content blocked)
  if(u.startsWith('http://')) u = 'https://' + u.slice(7);
  // Only keep valid http(s) URLs
  if(!/^https?:\/\//i.test(u)) return '';
  return u;
}

async function parseM3u(content){
  const lines = content.split(/\r?\n/);
  const channels = [];
  let cur = null;

  for(let line of lines){
    line = line.trim();
    if(line.startsWith('#EXTINF')){
      // Name (after last comma)
      const nm = line.match(/#EXTINF:[^,]*,?(.*)$/);
      let name = (nm?.[1] || 'Channel').trim();
      // Logo – support both " and ' and also unquoted in some broken lists
      let logo = '';
      const lm1 = line.match(/tvg-logo=["']([^"']*)["']/i);
      const lm2 = line.match(/tvg-logo=([^\s,]+)/i);
      if(lm1) logo = lm1[1];
      else if(lm2) logo = lm2[1];
      // Category
      let cat = 'Other';
      const gm = line.match(/group-title=["']([^"']*)["']/i);
      if(gm) cat = gm[1].trim() || 'Other';

      cur = { name, logo: cleanLogo(logo), category: cat };
    }
    else if(line && !line.startsWith('#') && cur){
      channels.push({
        name: cur.name.substring(0, 45),
        url: line,
        category: cur.category || 'Other',
        logo: cur.logo || ''
      });
      cur = null;
    }
    else if(line && !line.startsWith('#') && (line.includes('.m3u8') || line.includes('.ts'))){
      channels.push({
        name: `Channel ${channels.length + 1}`,
        url: line,
        category: 'Other',
        logo: ''
      });
    }
  }
  return channels;
}

async function loadAllPlaylists(){
  if(!FIXED_PLAYLISTS.length) return [];
  const res = await Promise.allSettled(FIXED_PLAYLISTS.map(async item => {
    if(!item.sourceKey) return [];
    const c = await fetchM3u(item.sourceKey);
    if(!c) return [];
    return parseM3u(c);
  }));
  let merged = [];
  for(const r of res) if(r.status === 'fulfilled') merged.push(...r.value);

  // Deduplicate by URL
  const unique = new Map();
  for(const ch of merged) if(!unique.has(ch.url)) unique.set(ch.url, ch);

  return Array.from(unique.values()).map(ch => ({
    ...ch,
    // Final logo: cleaned URL or local SVG placeholder
    logo: (ch.logo && ch.logo.startsWith('http')) ? ch.logo : PLACEHOLDER_SVG(ch.name)
  }));
}

// ===== CATEGORIES =====
function buildCatTabs(list){
  const cats = new Set(['all']), counts = {};
  list.forEach(ch => {
    const c = ch.category || 'Other';
    cats.add(c);
    counts[c] = (counts[c] || 0) + 1;
  });
  const sorted = Array.from(cats).sort((a,b) => a === 'all' ? -1 : b === 'all' ? 1 : a.localeCompare(b));
  catTabs.innerHTML = '';
  sorted.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab';
    btn.dataset.cat = cat;
    if(cat === activeCategory) btn.classList.add('active');
    const cnt = cat === 'all' ? list.length : (counts[cat] || 0);
    btn.innerHTML = `${cat === 'all' ? 'সবগুলো' : cat} <span class="cat-count">${cnt}</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = cat;
      filterRender();
    };
    catTabs.appendChild(btn);
  });
}

// ===== RENDER (optimized + logo fix) =====
function filterRender(){
  if(!allChannels.length) return;
  const filtered = allChannels.filter(ch => {
    const mc = activeCategory === 'all' || ch.category === activeCategory;
    const ms = searchQuery === '' || ch.name.toLowerCase().includes(searchQuery.toLowerCase());
    return mc && ms;
  });
  renderChannels(filtered);
  infoCount.textContent = `${filtered.length} চ্যানেল`;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderChannels(arr){
  chGrid.innerHTML = '';
  if(!arr.length){
    chGrid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>কোনো চ্যানেল পাওয়া যায়নি</p></div>`;
    return;
  }

  const frag = document.createDocumentFragment();

  for(const ch of arr){
    const card = document.createElement('div');
    card.className = 'ch-card';
    if(currentChannel && currentChannel.url === ch.url) card.classList.add('active');

    // Use cleaned logo or local SVG
    const logoSrc = ch.logo || PLACEHOLDER_SVG(ch.name);

    card.innerHTML = `
      <div class="live-pip"></div>
      <div class="ch-play">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.55)"/>
          <polygon points="10 8 16 12 10 16 10 8" fill="white"/>
        </svg>
      </div>
      <div class="ch-logo-wrap">
        <img class="ch-logo" 
             src="${logoSrc}" 
             alt="${esc(ch.name)}"
             loading="lazy"
             decoding="async"
             referrerpolicy="no-referrer"
             onerror="this.onerror=null;this.src='${PLACEHOLDER_SVG(ch.name)}';">
      </div>
      <div class="ch-name">${esc(ch.name)}</div>`;

    card.onclick = () => {
      if(retryTimeout) clearTimeout(retryTimeout);
      currentLoadRetries = 0;
      globalErrorShown = false;
      currentChannel = ch;
      nowTitle.textContent = ch.name;
      loadStream(ch.url);
      document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      if(window.innerWidth < 992) document.querySelector('.player-section')?.scrollIntoView({behavior:'smooth'});
    };

    frag.appendChild(card);
  }

  chGrid.appendChild(frag);
}

chSearch.addEventListener('input', e => {
  searchQuery = e.target.value;
  filterRender();
});

// ===== VISIBILITY =====
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    if(hls) hls.stopLoad();
    vp.pause();
  } else {
    if(hls) hls.startLoad();
    if(currentChannel && vp.paused) vp.play().catch(()=>{});
  }
});

// ===== INIT =====
async function initApp(){
  buildColorPalette();
  initTheme();
  globalLoader.style.display = 'flex';
  infoLabel.textContent = 'প্লেলিস্ট লোড হচ্ছে...';

  await loadConfig();

  if(!FIXED_PLAYLISTS.length){
    chGrid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <p>প্লেলিস্ট কনফিগ পাওয়া যায়নি।</p></div>`;
    infoLabel.textContent = 'কনফিগ লোড ব্যর্থ';
    globalLoader.style.opacity = '0';
    setTimeout(() => globalLoader.style.display = 'none', 400);
    return;
  }

  infoLabel.textContent = 'চ্যানেল লোড হচ্ছে...';
  const channels = await loadAllPlaylists();

  if(!channels.length){
    chGrid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      <p>কোনো চ্যানেল পাওয়া যায়নি।</p></div>`;
    infoLabel.textContent = 'কোনো চ্যানেল নেই';
    globalLoader.style.opacity = '0';
    setTimeout(() => globalLoader.style.display = 'none', 400);
    return;
  }

  allChannels = channels;
  activeCategory = 'all';
  searchQuery = '';
  buildCatTabs(allChannels);
  filterRender();
  infoLabel.textContent = 'মোট চ্যানেল';
  infoCount.textContent = `${allChannels.length}`;

  if(allChannels.length){
    const first = allChannels[0];
    currentChannel = first;
    nowTitle.textContent = first.name;
    loadStream(first.url);
  }

  globalLoader.style.opacity = '0';
  setTimeout(() => globalLoader.style.display = 'none', 400);
}

initApp();
</script>
